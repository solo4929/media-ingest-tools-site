<h1>Multimedia Renamer</h1>
<p>Multimedia Renamer（media-ingest-tools）は、SD カードの写真・動画を Mac に取り込むための個人用ツールです。撮影日時と機種ごとに整理して保存し、選んだ写真を利用者本人の Google フォト ライブラリに追加します。</p>
<p>Google アカウントへのアクセスは、Google フォトへ写真を追加するためだけに使います（スコープ <code>photoslibrary.appendonly</code>）。ライブラリにある写真の閲覧・変更・削除はしません。</p>
<p><a href="privacy.html">プライバシーポリシー</a></p>
<p>お問い合わせ：<a href="https://github.com/solo4929/media-ingest-tools-site/issues">GitHub の Issues</a></p>
